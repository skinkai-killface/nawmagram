name: Build Nawmagram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Nawmagram APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Nawmagram overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Clone Telegram Android source
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            https://github.com/DrKLO/Telegram.git telegram
          echo "Telegram cloned: $(git -C telegram log --oneline -1)"

      - name: Apply Nawmagram patches
        run: |
          cp overlay/overlay/res/values/colors.xml \
            telegram/TMessagesProj/src/main/res/values/colors.xml
          cp overlay/overlay/res/values-night/colors.xml \
            telegram/TMessagesProj/src/main/res/values-night/colors.xml
          cp overlay/overlay/res/values-night/styles.xml \
            telegram/TMessagesProj/src/main/res/values-night/styles.xml
          cp overlay/overlay/res/values-v21/styles.xml \
            telegram/TMessagesProj/src/main/res/values-v21/styles.xml

          mkdir -p telegram/TMessagesProj/src/main/java/org/telegram/messenger/fork/theme
          cp overlay/overlay/java/org/telegram/messenger/fork/theme/ThemeManager.kt \
             telegram/TMessagesProj/src/main/java/org/telegram/messenger/fork/theme/

          # App name
          sed -i 's|<string name="AppName">Telegram</string>|<string name="AppName">Nawmagram</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="AppNameBeta">Telegram Beta</string>|<string name="AppNameBeta">Nawmagram Beta</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          # Intro screen
          sed -i 's|<string name="Page1Title">Telegram</string>|<string name="Page1Title">Nawmagram</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          # Notifications
          sed -i 's|<string name="NotificationHiddenName">Telegram</string>|<string name="NotificationHiddenName">Nawmagram</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="NotificationHiddenChatName">Telegram</string>|<string name="NotificationHiddenChatName">Nawmagram</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          # Secret chat & lock
          sed -i 's|<string name="SecretChatName">Telegram</string>|<string name="SecretChatName">Nawmagram</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="AppLocked">Telegram Locked</string>|<string name="AppLocked">Nawmagram Locked</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          # Calls
          sed -i 's|<string name="VoipInCallBranding">Telegram Call</string>|<string name="VoipInCallBranding">Nawmagram Call</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="VoipInVideoCallBranding">Telegram Video Call</string>|<string name="VoipInVideoCallBranding">Nawmagram Video Call</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="VoipInConferenceCallBranding">Telegram Group Call</string>|<string name="VoipInConferenceCallBranding">Nawmagram Group Call</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="CallViaTelegram">Telegram Call</string>|<string name="CallViaTelegram">Nawmagram Call</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="VideoCallViaTelegram">Telegram Video Call</string>|<string name="VideoCallViaTelegram">Nawmagram Video Call</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="VoiceCallViaTelegram">Telegram Voice Call</string>|<string name="VoiceCallViaTelegram">Nawmagram Voice Call</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="VoipInCallBrandingWithName">Telegram Call to %s</string>|<string name="VoipInCallBrandingWithName">Nawmagram Call to %s</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="VoipInVideoCallBrandingWithName">Telegram Video Call to %s</string>|<string name="VoipInVideoCallBrandingWithName">Nawmagram Video Call to %s</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|Telegram will call you in|Nawmagram will call you in|g' telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|Telegram can call you in|Nawmagram can call you in|g' telegram/TMessagesProj/src/main/res/values/strings.xml
          # Map provider
          sed -i 's|<string name="MapPreviewProviderTelegram">Telegram</string>|<string name="MapPreviewProviderTelegram">Nawmagram</string>|' telegram/TMessagesProj/src/main/res/values/strings.xml
          echo "All string patches applied"

          cp overlay/overlay/gradle.properties telegram/gradle.properties
          sed -i 's/APP_PACKAGE=org\.telegram\.nawmagram/APP_PACKAGE=org.telegram.messenger/' \
            telegram/gradle.properties

          python3 overlay/scripts/patch_google_services.py
          python3 overlay/scripts/apply_all_branding.py telegram
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/g' telegram/TMessagesProj_App/build.gradle
          echo "All patches applied"

      - name: Write API credentials into BuildVars.java
        run: |
          BUILDVARS="telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          sed -i "s|public static int APP_ID = .*;|public static int APP_ID = ${{ secrets.TELEGRAM_APP_ID }};|" "$BUILDVARS"
          sed -i "s|public static String APP_HASH = \".*\";|public static String APP_HASH = \"${{ secrets.TELEGRAM_APP_HASH }}\";|" "$BUILDVARS"
          echo "APP_ID injected: $(grep 'APP_ID =' $BUILDVARS)"
          echo "APP_HASH injected: $(grep 'APP_HASH =' $BUILDVARS)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('telegram/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Gradlew permissions
        run: chmod +x telegram/gradlew

      - name: Build Debug APK
        working-directory: telegram
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          APK=$(find telegram/TMessagesProj_App/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" Nawmagram-v1.0.apk
          echo "APK_PATH=Nawmagram-v1.0.apk" >> $GITHUB_ENV
          echo "APK size: $(du -sh Nawmagram-v1.0.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nawmagram-v1.0-build${{ github.run_number }}
          path: Nawmagram-v1.0.apk
          retention-days: 30

      - name: Update GitHub Release v1.0
        run: |
          # Delete old release + tag if exists
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.0 \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))")
          if [ -n "$RELEASE_ID" ]; then
            curl -s -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID
          fi
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/tags/v1.0 || true
          sleep 2

          # Create fresh release
          UPLOAD_URL=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{
              \"tag_name\": \"v1.0\",
              \"name\": \"Nawmagram v1.0\",
              \"body\": \"## Nawmagram v1.0\n\nCustom Telegram Android fork.\n\n### Changes\n- Deep Space dark theme\n- Gradient chat bubbles\n- 3 built-in dark themes\n- Material You support\n\n### Install\nDownload APK below, enable Install from unknown sources, install.\",
              \"draft\": false,
              \"prerelease\": false
            }" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['upload_url'].replace('{?name,label}',''))")

          # Upload APK
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "$UPLOAD_URL?name=Nawmagram-v1.0.apk" \
            --data-binary @Nawmagram-v1.0.apk \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Released:', d.get('browser_download_url',''))"

          echo "## Nawmagram v1.0 released!" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/tag/v1.0" >> $GITHUB_STEP_SUMMARY
