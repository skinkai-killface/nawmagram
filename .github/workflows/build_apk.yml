name: 🔨 Build Nawmagram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Nawmagram APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Nawmagram overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: 📦 Clone Telegram Android source
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            https://github.com/DrKLO/Telegram.git telegram
          echo "✅ Telegram cloned: $(git -C telegram log --oneline -1)"

      - name: 🎨 Apply Nawmagram patches
        run: |
          # Colors & styles
          cp overlay/overlay/res/values/colors.xml telegram/TMessagesProj/src/main/res/values/colors.xml
          cp overlay/overlay/res/values-night/colors.xml telegram/TMessagesProj/src/main/res/values-night/colors.xml
          cp overlay/overlay/res/values-night/styles.xml telegram/TMessagesProj/src/main/res/values-night/styles.xml
          cp overlay/overlay/res/values-v21/styles.xml telegram/TMessagesProj/src/main/res/values-v21/styles.xml

          # ThemeManager.kt
          mkdir -p telegram/TMessagesProj/src/main/java/org/telegram/messenger/fork/theme
          cp overlay/overlay/java/org/telegram/messenger/fork/theme/ThemeManager.kt \
             telegram/TMessagesProj/src/main/java/org/telegram/messenger/fork/theme/

          # App name → Nawmagram
          sed -i 's|<string name="AppName">Telegram</string>|<string name="AppName">Nawmagram</string>|' \
            telegram/TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="AppNameBeta">Telegram Beta</string>|<string name="AppNameBeta">Nawmagram Beta</string>|' \
            telegram/TMessagesProj/src/main/res/values/strings.xml

          # gradle.properties — keep original package to match google-services.json
          # (google-services.json is tied to org.telegram.messenger, changing package breaks it)
          cp overlay/overlay/gradle.properties telegram/gradle.properties
          sed -i 's/APP_PACKAGE=org\.telegram\.nawmagram/APP_PACKAGE=org.telegram.messenger/' telegram/gradle.properties

          # Patch google-services.json to add our package name alongside the original
          GS=telegram/TMessagesProj/google-services.json
          if [ -f "$GS" ]; then
            python3 - <<'PYEOF'
import json, sys

with open("telegram/TMessagesProj/google-services.json") as f:
    data = json.load(f)

new_pkg = "org.telegram.nawmagram"
new_pkg_beta = "org.telegram.nawmagram.beta"

for client in data.get("client", []):
    pkg = client.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
    if "messenger" in pkg:
        # duplicate entry with our package name
        import copy
        clone = copy.deepcopy(client)
        clone["client_info"]["android_client_info"]["package_name"] = \
            pkg.replace("org.telegram.messenger", new_pkg)
        data["client"].append(clone)
        if ".beta" in pkg:
            clone2 = copy.deepcopy(client)
            clone2["client_info"]["android_client_info"]["package_name"] = new_pkg_beta
            data["client"].append(clone2)

with open("telegram/TMessagesProj/google-services.json", "w") as f:
    json.dump(data, f, indent=2)
print("✅ google-services.json patched")
PYEOF
          else
            echo "⚠️ google-services.json not found, skipping"
          fi

          echo "✅ All patches applied"

      - name: 🔑 Write API credentials
        run: |
          echo "APP_ID=${{ secrets.TELEGRAM_APP_ID }}" >> telegram/local.properties
          echo "APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}" >> telegram/local.properties

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('telegram/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 🔓 Gradlew permissions
        run: chmod +x telegram/gradlew

      - name: 🏗️ Build Debug APK
        working-directory: telegram
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nawmagram-${{ github.run_number }}
          path: telegram/TMessagesProj_App/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 📊 Build summary
        run: |
          APK=$(find telegram/TMessagesProj_App/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "## ✅ Nawmagram APK built!" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "**File:** $(basename $APK)" >> $GITHUB_STEP_SUMMARY
          fi
